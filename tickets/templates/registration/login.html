<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Iniciar sesión — TicketSystem</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: 'Inter', system-ui, sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0,0,0,.2);
      padding: 2.5rem;
      width: 100%;
      max-width: 400px;
    }
    .brand i { font-size: 2rem; }
    .btn-primary { background-color: #4f46e5; border-color: #4f46e5; }
    .btn-primary:hover { background-color: #4338ca; border-color: #4338ca; }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="text-center mb-4 brand">
      <i class="bi bi-ticket-perforated-fill text-primary"></i>
      <h1 class="h4 mt-2 fw-bold">TicketSystem</h1>
      <p class="text-muted small">Iniciá sesión para continuar</p>
    </div>

    {% if form.errors %}
      <div class="alert alert-danger small">
        <i class="bi bi-exclamation-triangle me-1"></i>
        Usuario o contraseña incorrectos. Intentá nuevamente.
      </div>
    {% endif %}

    <form method="post">
      {% csrf_token %}
      <div class="mb-3">
        <label for="id_username" class="form-label fw-semibold small">Usuario</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-person text-muted"></i></span>
          <input type="text" name="username" id="id_username"
                 class="form-control" placeholder="Tu nombre de usuario" autofocus required />
        </div>
      </div>
      <div class="mb-4">
        <label for="id_password" class="form-label fw-semibold small">Contraseña</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-lock text-muted"></i></span>
          <input type="password" name="password" id="id_password"
                 class="form-control" placeholder="••••••••" required />
        </div>
      </div>
      <input type="hidden" name="next" value="{{ next }}" />
      <button type="submit" class="btn btn-primary w-100 fw-semibold">
        <i class="bi bi-box-arrow-in-right me-1"></i>Iniciar sesión
      </button>
    </form>

    <hr class="my-4" />

    <p class="text-center small mb-2">
      <a href="{% url 'tickets:reportar' %}" class="text-decoration-none">
        <i class="bi bi-megaphone me-1"></i>¿No tenés cuenta? Reportar un problema
      </a>
    </p>
    <p class="text-center small mb-0">
      <a href="{% url 'tickets:consultar_codigo' %}" class="text-decoration-none">
        <i class="bi bi-key me-1"></i>Consultar el estado de un ticket
      </a>
    </p>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
